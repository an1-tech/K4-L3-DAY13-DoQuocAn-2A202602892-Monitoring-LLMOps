alerts:
  - name: HighUserVisibleLatency
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: ai-platform
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: ai-platform
    runbook: docs/alerts.md#alert-2
  - name: QualityDegradation
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 15m
    type: symptom-based
    channel: slack
    owner: llm-operations
    runbook: docs/alerts.md#alert-3

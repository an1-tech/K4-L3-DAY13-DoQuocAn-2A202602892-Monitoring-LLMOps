service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  description: Requests must complete successfully within 3000 milliseconds.
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_minutes: 201.6
  rationale: >
    A 28-day window contains 40320 minutes. The 0.5 percent error budget
    permits 201.6 minutes that do not satisfy the latency and success SLI.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
